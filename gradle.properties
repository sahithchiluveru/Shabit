org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

android.useAndroidX=true
kotlin.code.style=official

# KSP (Room's annotation processor) registers its generated sources through
# kotlin.sourceSets, which AGP 9's built-in Kotlin rejects by default —
# b/386221070, "Built-in Kotlin support in AGP should not synchronize with the
# Kotlin sourcesets". 2.2.10-2.0.2 is the KSP version AGP pins itself, so there
# is no newer KSP to move to without also dragging KGP off the version AGP
# bundles and breaking the Compose compiler's lockstep. Drop this when AGP fixes
# the sync.
android.disallowKotlinSourceSets=false
