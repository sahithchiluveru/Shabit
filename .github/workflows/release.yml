name: Release

# Tagging is the whole trigger: `git tag v1.0.0 && git push --tags` is a release.
# Nothing here runs on a branch push, so a release cannot happen by accident.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Sign and publish the APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # An empty secret would otherwise sail through base64 and leave Gradle falling
      # back to debug signing — an APK that cannot be installed over a real one. Fail
      # here, before anything is built, rather than publishing that.
      - name: Check the signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See #8."
              exit 1
            fi
          done

      # The tag names the release; versionName names the APK and is what Android
      # compares on upgrade. If they disagree, one of them is a mistake.
      - name: Check the tag matches versionName
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Into RUNNER_TEMP, never the workspace: nothing under the checkout can then be
      # picked up by an artifact upload, and the repo is public.
      - name: Decode the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/shabit-release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble the release APK
        env:
          SHABIT_KEYSTORE: ${{ runner.temp }}/shabit-release.jks
          SHABIT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SHABIT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SHABIT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # No --info or --debug: those echo the environment, and the environment is
        # where the passwords are. --stacktrace is safe and is what build.yml uses.
        run: ./gradlew assembleRelease --stacktrace

      # The one check that proves the fallback was not taken. A debug-signed APK is
      # the data-loss path in #8: Android will not install it over a real release, and
      # the only way forward on the phone is uninstall, which wipes every habit.
      - name: Check the APK is signed with the release key
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::The APK is debug-signed. It would not install over a real release."
            exit 1
          fi

      - name: Name the APK after the release
        run: |
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/shabit-v$VERSION.apk"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$RUNNER_TEMP/shabit-v$VERSION.apk"

      # Runners are torn down anyway; this is here so the keystore's lifetime is
      # visible in the file rather than implied.
      - name: Shred the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shabit-release.jks"
